[project]
name = "medical-qa-project"
version = "1.0.0"
description = "Medical Question Answering - Deep Learning Project (Closed-book, Prompting, Fine-tuning, RAG)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    # Core
    "datasets>=2.16.0",
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "tqdm>=4.66.0",
    "pyyaml>=6.0.1",
    "typer>=0.9.0",
    "rich>=13.7.0",
    
    # LLM APIs
    "openai>=1.12.0",
    "httpx>=0.26.0",
    "tenacity>=8.2.0",
    
    # Local LLM (Ollama)
    "ollama>=0.1.6",
    
    # Hugging Face
    "transformers>=4.37.0",
    "accelerate>=0.26.0",
    "peft>=0.8.0",
    "bitsandbytes>=0.42.0",
    "safetensors>=0.4.0",
    "sentencepiece>=0.1.99",
    
    # Evaluation
    "rouge-score>=0.1.2",
    "sacrebleu>=2.4.0",
    "nltk>=3.8.1",
    
    # RAG
    "wikipedia-api>=0.6.0",
    "duckduckgo-search>=4.1.0",
    "sentence-transformers>=2.3.0",
    "faiss-cpu>=1.7.4",
    
    # Report generation
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "jinja2>=3.1.0",
    
    # Utilities
    "python-dotenv>=1.0.0",
    "diskcache>=5.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=24.1.0",
    "ruff>=0.1.0",
]
gpu = [
    "torch>=2.1.0",
]
cpu = [
    "torch>=2.1.0",
]

[project.scripts]
medqa-data = "src.data.cli:app"
medqa-generate = "src.generation.cli:app"
medqa-rag = "src.rag.cli:app"
medqa-finetune = "src.finetune.cli:app"
medqa-eval = "src.eval.cli:app"
medqa-report = "src.report.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I", "UP"]
