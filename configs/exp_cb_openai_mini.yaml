exp_name: cb_openai_mini
seed: 42
data:
  split_path: data/splits/test.jsonl
  limit: 500
prompt:
  path: src/prompts/answerer_prompts.yaml
  prompt_id: one_sentence_strict
  postprocess_one_sentence: true
model:
  provider: openai
  name: gpt-4o-mini
  temperature: 0.2
  max_tokens: 64
  api_key_env: OPENAI_API_KEY
  pricing:
    prompt_per_1k: 0.00015
    completion_per_1k: 0.0006
output:
  pred_path: results/preds/cb_openai_mini.jsonl
  score_path: results/scores/cb_openai_mini.csv
  qualitative_path: results/qualitative/cb_openai_mini.html
  judge_path: results/judge/cb_openai_mini.jsonl
  judge_path_2: results/judge/cb_openai_mini_pass2.jsonl
  cache: true
logging:
  log_path: results/logs/cb_openai_mini.log
