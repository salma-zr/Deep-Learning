# Experiment 13: HuggingFace Flan-T5 with One-Sentence Prompt
# Prompt engineering variant

name: exp_13_hf_one_sentence

# Strategy
strategy: closed_book
description: "Flan-T5-base with one-sentence-strict prompt"

# Model configuration
backend: huggingface
model: google/flan-t5-base
temperature: 0.0
max_tokens: 256
device: cpu

# Prompt
prompt_id: one_sentence_strict

# Evaluation settings
split: tiny_test
limit: 200

# Expected behavior
objective: "Test strict one-sentence prompt format"
expected_cost_usd: 0.0
