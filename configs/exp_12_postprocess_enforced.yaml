# Experiment 12: Postprocess Single-Sentence Enforcement
# Ablation: with vs without postprocessing

name: exp_12_postprocess_enforced

# Strategy
strategy: closed_book
description: "Postprocess ablation: enforce one-sentence via normalization"

# Model configuration
backend: openai
model: gpt-4o-mini
temperature: 0.0
max_tokens: 256

# Prompt
prompt_id: one_sentence_strict
system_prompt: "You are a helpful medical assistant. Answer questions concisely in one sentence."

# Postprocess
postprocess_single_sentence: true

# Evaluation settings
split: test
limit: 500

# Expected behavior
objective: "Measure impact of postprocessing on format compliance"
expected_cost_usd: 0.50

# Ablation info
ablation_of: exp_01_openai_baseline
ablation_variable: postprocess_single_sentence
ablation_values: [false, true]

# Notes
notes: |
  - Applies a deterministic postprocess step
  - Extracts first sentence and removes markdown formatting
  - Used to isolate formatting effects from model behavior
