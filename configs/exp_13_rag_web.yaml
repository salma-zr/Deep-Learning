# Experiment 13 (Optional): RAG with Web Search
# Retrieval-Augmented Generation using DuckDuckGo

name: exp_13_rag_web

# Strategy
strategy: rag
description: "Optional RAG with web search (DuckDuckGo)"

# Model configuration (for generation)
backend: openai
model: gpt-4o-mini
temperature: 0.0
max_tokens: 256

# RAG configuration
retriever_type: web
top_k: 3
max_context_chars: 2000

# Prompt
prompt_id: one_sentence_strict

# Evaluation settings
split: test
limit: 500

# Expected behavior
objective: "Compare web retrieval to Wikipedia retrieval"
expected_cost_usd: 0.70

# Notes
notes: |
  - Optional experiment (enable with --with-web-rag)
  - Web search can introduce noise or inconsistent sources
  - Useful for discussing retrieval quality limits
