# Experiment 07: RAG Top-K Ablation
# Test effect of number of retrieved documents

name: exp_07_rag_topk5

# Strategy
strategy: rag
description: "RAG ablation: top_k=5 (more context)"

# Model configuration
backend: openai
model: gpt-4o-mini
temperature: 0.0
max_tokens: 256

# RAG configuration - increased top_k
retriever_type: wikipedia
top_k: 5  # Ablation: 3 vs 5
max_context_chars: 3000  # Also increased

# Prompt
prompt_id: one_sentence_strict

# Evaluation settings
split: test
limit: 500

# Expected behavior
objective: "Test effect of retrieving more documents"
expected_cost_usd: 0.70

# Ablation info
ablation_of: exp_06_rag_wikipedia
ablation_variable: top_k
ablation_values: [3, 5]

# Notes
notes: |
  - More documents may provide better coverage
  - But also more noise and longer prompts
  - Compare latency and cost vs exp_06
