# Experiment 01: OpenAI GPT-4o-mini Baseline
# Closed-book generation with cloud API

name: exp_01_openai_baseline

# Strategy
strategy: closed_book
description: "Baseline closed-book with GPT-4o-mini (cost-efficient cloud model)"

# Model configuration
backend: openai
model: gpt-4o-mini
temperature: 0.0
max_tokens: 256

# Prompt
prompt_id: one_sentence_strict
system_prompt: "You are a helpful medical assistant. Answer questions concisely in one sentence."

# Evaluation settings
split: test
limit: 500  # Limit for cost control

# Expected behavior
objective: "Establish cloud API baseline performance for medical QA"
expected_cost_usd: 0.50  # Rough estimate

# Notes
notes: |
  - Uses OpenAI's most cost-efficient model
  - Good balance of quality and cost
  - Baseline for comparing other approaches
