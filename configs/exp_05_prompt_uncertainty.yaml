# Experiment 05: Uncertainty-Allowed Prompt
# Prompt engineering - allows "I don't know"

name: exp_05_prompt_uncertainty

# Strategy
strategy: closed_book
description: "Prompt engineering: Allow uncertainty/abstention"

# Model configuration
backend: openai
model: gpt-4o-mini
temperature: 0.0
max_tokens: 256

# Prompt - allows expressing uncertainty
prompt_id: uncertainty_allowed
system_prompt: "You are a careful medical assistant. Only answer if you are confident."

# Evaluation settings
split: test
limit: 500

# Expected behavior
objective: "Test if allowing uncertainty reduces hallucinations"
expected_cost_usd: 0.50

# Notes
notes: |
  - May increase "Insufficient information" responses
  - Trade-off: fewer answers but potentially more accurate
  - Useful for measuring model confidence calibration
