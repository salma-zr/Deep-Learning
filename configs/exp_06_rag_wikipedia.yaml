# Experiment 06: RAG with Wikipedia
# Retrieval-Augmented Generation using Wikipedia

name: exp_06_rag_wikipedia

# Strategy
strategy: rag
description: "RAG with Wikipedia retrieval for knowledge grounding"

# Model configuration (for generation)
backend: openai
model: gpt-4o-mini
temperature: 0.0
max_tokens: 256

# RAG configuration
retriever_type: wikipedia
top_k: 3
max_context_chars: 2000

# Prompt
prompt_id: one_sentence_strict

# Evaluation settings
split: test
limit: 500

# Expected behavior
objective: "Test if retrieval improves factual accuracy"
expected_cost_usd: 0.60  # Slightly more due to longer prompts

# Notes
notes: |
  - Wikipedia provides generally reliable medical info
  - Context helps ground model responses
  - May introduce latency from retrieval
  - Watch for retrieval quality issues
