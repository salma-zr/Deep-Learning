exp_name: prompt_uncertainty
seed: 42
data:
  split_path: data/splits/test.jsonl
  limit: 500
prompt:
  path: src/prompts/answerer_prompts.yaml
  prompt_id: uncertainty_allowed
  postprocess_one_sentence: true
model:
  provider: openai
  name: gpt-4o-mini
  temperature: 0.2
  max_tokens: 64
  api_key_env: OPENAI_API_KEY
  pricing:
    prompt_per_1k: 0.00015
    completion_per_1k: 0.0006
output:
  pred_path: results/preds/prompt_uncertainty.jsonl
  score_path: results/scores/prompt_uncertainty.csv
  qualitative_path: results/qualitative/prompt_uncertainty.html
  judge_path: results/judge/prompt_uncertainty.jsonl
  judge_path_2: results/judge/prompt_uncertainty_pass2.jsonl
  cache: true
logging:
  log_path: results/logs/prompt_uncertainty.log
